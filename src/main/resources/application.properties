spring.application.name=WorkForceMgmt

# ── Common config (shared across all profiles) ──
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# Default to dev profile; override with SPRING_PROFILES_ACTIVE=prod in production
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Rate Limiter Config (configurable via environment variables)
rate.limiter.max-attempts=${RATE_LIMIT_MAX_ATTEMPTS:5}
rate.limiter.time-window-ms=${RATE_LIMIT_TIME_WINDOW_MS:60000}
jwt.refresh-token.expiration-ms=${REFRESH_TOKEN_EXPIRATION_MS:604800000}