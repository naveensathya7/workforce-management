# ── Dev Profile: local development settings ──
# Non-secret dev values are hardcoded here; secrets come from .env file

# Dev database (local PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5432/workforce-db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# Dev JWT config
jwt.secret-key=${JWT_SECRET_KEY}
jwt.expiration-ms=86400000

# Show SQL for debugging (optional, dev-only)
spring.jpa.show-sql=true